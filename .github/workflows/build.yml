name: Build

# The FakeR36S-OS package (./build.sh), with nothing of the game in it: on every push to main as an artifact, and for
# a tag like v0.1.0 as that tag's release, with RELEASE.md as its notes. No ROM is used anywhere in CI.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The armhf game
        run: GL_JOBS=$(nproc) ./build.sh game

      - name: ghostship.o2r (the port's own archive)
        run: GL_JOBS=$(nproc) ./build.sh port

      - name: GLES2 shaders through glslang
        run: GL_JOBS=$(nproc) ./build.sh shaders

      - name: Libraries and the package
        run: |
          v=$(git describe --tags --always)
          case $GITHUB_REF in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac
          export APP_VERSION=$v
          ./build.sh libs
          ./build.sh fakers36s
          ls -la out/*.zip

      - name: ARMv7 check and NEEDED
        run: ./build.sh check

      - uses: actions/upload-artifact@v4
        with:
          name: FakeR36S-SM64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "FakeR36S-SM64 ${GITHUB_REF_NAME#v}: Super Mario 64 native for FakeR36S-OS" --notes-file RELEASE.md
